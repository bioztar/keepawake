name: windows

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: windows/go.mod
          cache: false

      - name: Go vet + unit tests
        working-directory: windows
        run: |
          go vet ./...
          go test -v ./...

      - name: Build keepawake.exe (x64 + arm64, no console)
        working-directory: windows
        run: |
          $env:CGO_ENABLED = '0'
          $env:GOARCH = 'amd64'; go build -trimpath -ldflags "-s -w -H=windowsgui" -o ..\dist\keepawake-windows-x64.exe .
          if ($LASTEXITCODE -ne 0) { throw 'build x64' }
          $env:GOARCH = 'arm64'; go build -trimpath -ldflags "-s -w -H=windowsgui" -o ..\dist\keepawake-windows-arm64.exe .
          if ($LASTEXITCODE -ne 0) { throw 'build arm64' }

      - name: Smoke - tray exe on for 5 s
        run: |
          $exe = (Resolve-Path dist\keepawake-windows-x64.exe).Path
          # PE optional header Subsystem: 2 = Windows GUI (no console window).
          $b = [IO.File]::ReadAllBytes($exe); $pe = [BitConverter]::ToInt32($b, 0x3C)
          $sub = [BitConverter]::ToUInt16($b, $pe + 24 + 68)
          if ($sub -ne 2) { throw "subsystem $sub, want 2 (GUI)" }
          $log = "$env:LOCALAPPDATA\keepawake\keepawake.log"
          Remove-Item "$log*" -ErrorAction SilentlyContinue
          $env:KEEPAWAKE_EVERY = '2'
          $p = Start-Process $exe -ArgumentList '--on', '5s', '--quit-when-off' -PassThru
          $null = $p.Handle
          Start-Sleep 2
          $second = Start-Process $exe -PassThru -Wait
          if ($second.ExitCode -ne 0) { throw "second launch exit $($second.ExitCode)" }
          if (-not $p.WaitForExit(30000)) { $p.Kill(); throw 'keepawake did not exit after 5 s' }
          $out = Get-Content $log -Raw
          Write-Host $out
          if ($p.ExitCode -ne 0) { throw "exit $($p.ExitCode)" }
          foreach ($want in 'SetThreadExecutionState(ES_CONTINUOUS|ES_SYSTEM_REQUIRED|ES_DISPLAY_REQUIRED) ok',
              'nudge ok (mouse): idle', 'SetThreadExecutionState(ES_CONTINUOUS) ok - normal sleep restored',
              'off (time is up)', 'notification: keepawake off - PC can sleep again.', 'second launch',
              'another keepawake was started', 'exit') {
            if (-not $out.Contains($want)) { throw "missing log line: $want" }
          }
          if ($out -match 'WARNING|ERROR') { throw 'unexpected warning in log' }
          $run = (Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Run).keepawake
          Write-Host "Run key: $run"
          if ($run -ne "`"$exe`" --autostart") { throw "Run key = $run" }
          Remove-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Run -Name keepawake

      - name: Pester (Windows PowerShell 5.1)
        shell: powershell
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -RequiredVersion 5.7.1
          $r = Invoke-Pester -Path windows\tests -Output Detailed -PassThru
          if ($r.FailedCount -gt 0 -or $r.Result -ne 'Passed') { throw 'Pester failed' }

      - name: Pester (PowerShell 7)
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -RequiredVersion 5.7.1
          $r = Invoke-Pester -Path windows\tests -Output Detailed -PassThru
          if ($r.FailedCount -gt 0 -or $r.Result -ne 'Passed') { throw 'Pester failed' }

      - name: Run keepawake.ps1 5s (Windows PowerShell 5.1)
        run: |
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File windows\keepawake.ps1 5s 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) { throw "exit $code" }
          foreach ($want in 'SetThreadExecutionState(ES_CONTINUOUS|ES_SYSTEM_REQUIRED|ES_DISPLAY_REQUIRED) ok', 'time is up', 'normal sleep restored') {
            if (-not $out.Contains($want)) { throw "missing log line: $want" }
          }

      - name: Run keepawake.ps1 in Constrained Language Mode
        run: |
          $cmd = '$ExecutionContext.SessionState.LanguageMode = "ConstrainedLanguage"; & .\windows\keepawake.ps1 5s; exit $LASTEXITCODE'
          $out = powershell -NoProfile -ExecutionPolicy Bypass -Command $cmd 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          # 1 = nothing could be covered; 0 = presentation mode covered "awake" for the 5 s.
          if ($code -notin 0, 1) { throw "exit $code" }
          foreach ($want in 'Constrained Language Mode', 'presence: NOT covered') {
            if (-not $out.Contains($want)) { throw "missing: $want" }
          }
          if ($out -match 'SetThreadExecutionState\(') { throw 'CLM run must not claim Win32 access' }
          $global:LASTEXITCODE = 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: windows/go.mod
          cache: false

      - name: Build and zip
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          $env:CGO_ENABLED = '0'
          New-Item -ItemType Directory -Force dist\zip | Out-Null
          Push-Location windows
          foreach ($a in @{ go = 'amd64'; name = 'x64' }, @{ go = 'arm64'; name = 'arm64' }) {
            $env:GOARCH = $a.go
            go build -trimpath -ldflags "-s -w -H=windowsgui -X main.version=$env:VERSION" -o "..\dist\keepawake-windows-$($a.name).exe" .
            if ($LASTEXITCODE -ne 0) { throw "go build $($a.go) failed" }
          }
          Pop-Location
          Copy-Item dist\keepawake-windows-*.exe, windows\keepawake.ps1, README.md, LICENSE dist\zip
          Compress-Archive -Path dist\zip\* -DestinationPath dist\keepawake-windows.zip -Force
          Get-ChildItem dist\keepawake-windows* -File | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Set-Content -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          $pre = @()
          if ($env:VERSION.Contains('-')) { $pre = @('--prerelease') }
          gh release create $env:VERSION --title "keepawake $env:VERSION" --generate-notes --verify-tag @pre `
            (Get-ChildItem dist\keepawake-windows* -File).FullName dist\SHA256SUMS.txt
